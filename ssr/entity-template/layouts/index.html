<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - Brreg Historie</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    {{ with .Params.organisasjonsnummer }}<meta name="orgnum" content="{{ . }}">{{ end }}
    {{ with .Params.navn }}<meta name="description" content="Historikk for {{ . }}">{{ end }}
    <style>
        article {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 100%;
        }
        article footer {
            margin-top: auto;
        }
    </style>
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>Brreg Historie</strong></li>
            </ul>
            <ul>
                <li><a href="{{ .Site.BaseURL }}">← Tilbake til søk</a></li>
            </ul>
        </nav>

        <article id="article">
            {{ .Content }}

            <footer>
                <small>
                    Data fra <a href="https://data.brreg.no" target="_blank">Brønnøysundregistrene</a>
                    {{ with .Params.lastModified }} • Sist oppdatert: {{ . }}{{ end }}
                </small>
            </footer>
        </article>
    </main>
</body>
</html>
