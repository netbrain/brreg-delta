<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <meta name="description" content="Se historiske endringer for norske enheter registrert i Brønnøysundregistrene">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>Brreg Historie</strong></li>
            </ul>
        </nav>

        {{ .Content }}

        <section>
            <form id="orgnum-form">
                <label for="orgnum">Organisasjonsnummer</label>
                <input
                    type="text"
                    id="orgnum"
                    name="orgnum"
                    placeholder="9 siffer (f.eks. 810034882)"
                    pattern="[0-9]{9}"
                    required
                    autofocus
                />
                <button type="submit">Vis historikk</button>
            </form>
        </section>

        <div id="entity-content"></div>

        <div id="loading" style="display: none;">
            <p aria-busy="true">Laster...</p>
        </div>

        <footer>
            <small>
                Data fra <a href="https://data.brreg.no" target="_blank">Brønnøysundregistrene</a>
                • Kildekode: <a href="https://github.com/netbrain/brreg-delta" target="_blank">GitHub</a>
            </small>
        </footer>
    </main>

    <script>
        document.getElementById('orgnum-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const orgnum = document.getElementById('orgnum').value.trim();

            if (orgnum.length === 9 && /^\d+$/.test(orgnum)) {
                // Convert orgnum to path: 810034882 -> 810/034/882
                const parts = [];
                for (let i = 0; i < orgnum.length; i += 3) {
                    parts.push(orgnum.substring(i, i + 3));
                }
                // Load from GitHub API (better CORS support)
                const path = `${parts.join('/')}/index.html`;
                const url = `https://api.github.com/repos/netbrain/brreg-delta/contents/${path}?ref=gh-pages`;
                const contentEl = document.getElementById('entity-content');
                const loadingEl = document.getElementById('loading');

                // Show loading indicator
                contentEl.innerHTML = '';
                loadingEl.style.display = 'block';

                // Fetch via GitHub API and decode base64 content
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        // Decode base64 to UTF-8 properly
                        const binaryString = atob(data.content);
                        const bytes = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) {
                            bytes[i] = binaryString.charCodeAt(i);
                        }
                        const content = new TextDecoder('utf-8').decode(bytes);
                        contentEl.innerHTML = content;
                        loadingEl.style.display = 'none';
                    })
                    .catch(error => {
                        contentEl.innerHTML = '<p>Fant ikke enheten. Sjekk at organisasjonsnummeret er riktig.</p>';
                        loadingEl.style.display = 'none';
                        console.error('Error:', error);
                    });
            }
        });
    </script>
</body>
</html>
