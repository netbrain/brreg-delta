name: Deploy Navigation Site to Public Branch

on:
  push:
    branches:
      - master
    paths:
      - 'ssr/navigation-site/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            go install github.com/gohugoio/hugo@latest && break || sleep 10
          done

      - name: Build navigation site
        run: |
          cd ssr/navigation-site
          hugo --minify --destination ../../public-output

      - name: Deploy to public branch
        run: |
          cd public-output
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy navigation site $(date +%Y-%m-%d)"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin HEAD:public
          echo "Navigation site deployed to public branch"
