name: Generate All Entity History Pages (Full Rebuild)

on:
  workflow_dispatch:
    inputs:
      clean_slate:
        description: 'Delete all existing content and rebuild from scratch'
        required: false
        type: boolean
        default: false

concurrency:
  group: brreg-data-workflows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-cache:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      shards: ${{ steps.find-shards.outputs.shards }}

    steps:
      - name: Generate cache key
        id: cache-key
        run: echo "key=data-git-${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT

      - name: Clone data branch (sparse, no checkout)
        run: |
          git clone --sparse --no-checkout --branch data \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git brreg-data

      - name: Find existing shards
        id: find-shards
        run: |
          cd brreg-data

          # Use git ls-tree to list directories without checking them out
          SHARDS=$(git ls-tree -d --name-only data:data | grep -E '^[89][0-9][0-9]$' | jq -R -s -c 'split("\n")[:-1]')

          if [ -z "$SHARDS" ] || [ "$SHARDS" = "[]" ]; then
            echo "No shards found in range 800-999"
            echo "shards=[]" >> $GITHUB_OUTPUT
          else
            echo "Found shards: $SHARDS"
            echo "shards=$SHARDS" >> $GITHUB_OUTPUT
          fi

      - name: Cache git repository
        uses: actions/cache/save@v4
        with:
          path: brreg-data/.git
          key: ${{ steps.cache-key.outputs.key }}

  generate-shard:
    needs: prepare-cache
    if: needs.prepare-cache.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 200
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.prepare-cache.outputs.shards) }}

    steps:
      - name: Checkout for composite action
        uses: actions/checkout@v4

      - name: Generate shard ${{ matrix.shard }}
        uses: ./.github/actions/generate-shard
        with:
          shard: ${{ matrix.shard }}
          cache-key: ${{ needs.prepare-cache.outputs.cache-key }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs: [prepare-cache, generate-shard]
    if: always() && needs.prepare-cache.outputs.shards != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            go install github.com/gohugoio/hugo@latest && break || sleep 10
          done

      - name: Free disk space
        uses: jlumbroso/free-diskspace@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup gh-pages branch
        run: |
          if [ "${{ inputs.clean_slate }}" = "true" ]; then
            echo "Clean slate mode: Recreating gh-pages branch from scratch"

            # Create fresh gh-pages directory
            mkdir -p gh-pages
            cd gh-pages
            git init
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Create .nojekyll file
            touch .nojekyll

            # Set up remote
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

            # Create initial commit
            git add .nojekyll
            git commit -m "Initialize gh-pages (clean slate)"

            # Force push to recreate branch
            git push -f origin HEAD:gh-pages
          else
            echo "Incremental mode: Checking out existing gh-pages branch"
            git clone --single-branch --branch gh-pages \
              https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages
          fi

      - name: Download and merge shard artifacts
        run: |
          # Get list of shards from prepare-cache output
          SHARDS='${{ needs.prepare-cache.outputs.shards }}'
          echo "Processing shards: $SHARDS"

          # Function to download and merge a single shard
          process_shard() {
            local shard=$1
            local run_id=$2
            local repo=$3
            local temp_dir=$(mktemp -d)

            echo "Downloading shard $shard..."

            # Download this shard's artifact with retries
            download_success=false
            for i in 1 2 3; do
              if gh run download "$run_id" -n "shard-$shard" -D "$temp_dir" -R "$repo"; then
                download_success=true
                break
              else
                echo "Attempt $i failed for shard $shard"
                sleep 10
              fi
            done

            if [ "$download_success" = false ]; then
              echo "Shard $shard not found or failed after 3 attempts, skipping"
              rm -rf "$temp_dir"
              return
            fi

            echo "Download complete for shard $shard"

            # Sync shard files to gh-pages (overwriting existing files)
            if [ -d "$temp_dir/$shard" ]; then
              rsync -a "$temp_dir/$shard/" "gh-pages/$shard/"
              echo "Merged shard $shard"
            else
              echo "Warning: Shard directory $shard not found in artifact"
            fi

            # Cleanup
            rm -rf "$temp_dir"
          }

          export -f process_shard
          export GH_TOKEN
          export RUN_ID="${{ github.run_id }}"
          export REPO="${{ github.repository }}"

          # Process shards in parallel with 4 workers
          echo $SHARDS | jq -r '.[]' | xargs -n 1 -P 4 -I {} bash -c 'process_shard {} "$RUN_ID" "$REPO"'

          echo "All shards merged"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Full rebuild $(date +%Y-%m-%d)"
            git push
            echo "Changes pushed successfully"
          fi
