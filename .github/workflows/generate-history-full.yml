name: Generate All Entity History Pages (Full Rebuild)

on:
  workflow_dispatch:

concurrency:
  group: history-generation-full
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 200
      fail-fast: true
      matrix:
        shard: [831]

    steps:
      # - name: Free disk space
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: true
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     docker-images: true
      #     swap-storage: true

      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Sparse checkout data branch (shard ${{ matrix.shard }} only)
        id: checkout
        run: |
          git clone --no-checkout --branch data --sparse \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git brreg-data
          cd brreg-data
          git sparse-checkout init --cone
          git sparse-checkout set data/${{ matrix.shard }}
          git checkout

          # Check if shard directory exists
          if [ ! -d "data/${{ matrix.shard }}" ]; then
            echo "Shard ${{ matrix.shard }} directory does not exist, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Create shard branch
        if: steps.checkout.outputs.skip != 'true'
        run: |
          mkdir gh-pages-temp
          cd gh-pages-temp
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Setup Go
        if: steps.checkout.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Hugo
        if: steps.checkout.outputs.skip != 'true'
        run: |
          for i in 1 2 3; do
            go install github.com/gohugoio/hugo@latest && break || sleep 10
          done

      - name: Build gen-history tool
        if: steps.checkout.outputs.skip != 'true'
        run: |
          cd brreg-delta/ssr/gen-history
          go build -o ../../../gen-history

      - name: Generate shard ${{ matrix.shard }}
        if: steps.checkout.outputs.skip != 'true'
        run: |
          cd brreg-data
          echo "Processing shard ${{ matrix.shard }}"
          ../gen-history shard --shard ${{ matrix.shard }} --output ../output --templates ../brreg-delta/ssr

      - name: Commit and push shard to dedicated branch
        if: steps.checkout.outputs.skip != 'true'
        run: |
          cd gh-pages-temp

          # Copy generated HTML files for this shard
          if [ -d ../output/${{ matrix.shard }} ]; then
            cp -r ../output/${{ matrix.shard }} .

            git add ${{ matrix.shard }}

            if ! git diff --cached --quiet; then
              git commit -m "Add shard ${{ matrix.shard }}"
              # Push to dedicated branch for this shard
              git push -f origin HEAD:gh-pages-shard-${{ matrix.shard }}
              echo "Successfully pushed shard ${{ matrix.shard }} to gh-pages-shard-${{ matrix.shard }}"
            else
              echo "No changes for shard ${{ matrix.shard }}"
            fi
          else
            echo "No output generated for shard ${{ matrix.shard }}"
          fi

  finalize:
    needs: generate-shard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            go install github.com/gohugoio/hugo@latest && break || sleep 10
          done

      - name: Build navigation site and create gh-pages
        run: |
          cd brreg-delta/ssr/navigation-site
          hugo --minify --destination ../../../gh-pages-output

          cd ../../../gh-pages-output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initialize with navigation site $(date +%Y-%m-%d)"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin HEAD:gh-pages

      - name: Merge shard branches into gh-pages
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git -b gh-pages gh-pages-work
          cd gh-pages-work
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for shard in 831; do
            echo "Merging shard $shard..."
            if git fetch origin gh-pages-shard-$shard:gh-pages-shard-$shard 2>/dev/null; then
              git merge --allow-unrelated-histories --no-edit gh-pages-shard-$shard || echo "Merge conflict or failed for shard $shard"
            else
              echo "Shard $shard branch does not exist, skipping"
            fi
          done

          git push origin gh-pages

      - name: Cleanup shard branches
        run: |
          cd gh-pages-work
          for shard in 831; do
            git push origin --delete gh-pages-shard-$shard 2>/dev/null || true
          done
          echo "Cleanup completed"
