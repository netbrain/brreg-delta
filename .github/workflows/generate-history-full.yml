name: Generate All Entity History Pages (Full Rebuild)

on:
  workflow_dispatch:

concurrency:
  group: history-generation-full
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 200
      fail-fast: true
      matrix:
        shard: [800, 801, 802, 803, 804, 805, 806, 807, 808, 809, 810, 811, 812, 813, 814, 815, 816, 817, 818, 819, 820, 821, 822, 823, 824, 825, 826, 827, 828, 829, 830, 831, 832, 833, 834, 835, 836, 837, 838, 839, 840, 841, 842, 843, 844, 845, 846, 847, 848, 849, 850, 851, 852, 853, 854, 855, 856, 857, 858, 859, 860, 861, 862, 863, 864, 865, 866, 867, 868, 869, 870, 871, 872, 873, 874, 875, 876, 877, 878, 879, 880, 881, 882, 883, 884, 885, 886, 887, 888, 889, 890, 891, 892, 893, 894, 895, 896, 897, 898, 899, 900, 901, 902, 903, 904, 905, 906, 907, 908, 909, 910, 911, 912, 913, 914, 915, 916, 917, 918, 919, 920, 921, 922, 923, 924, 925, 926, 927, 928, 929, 930, 931, 932, 933, 934, 935, 936, 937, 938, 939, 940, 941, 942, 943, 944, 945, 946, 947, 948, 949, 950, 951, 952, 953, 954, 955, 956, 957, 958, 959, 960, 961, 962, 963, 964, 965, 966, 967, 968, 969, 970, 971, 972, 973, 974, 975, 976, 977, 978, 979, 980, 981, 982, 983, 984, 985, 986, 987, 988, 989, 990, 991, 992, 993, 994, 995, 996, 997, 998, 999]

    steps:
      # - name: Free disk space
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: true
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     docker-images: true
      #     swap-storage: true

      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Sparse checkout data branch (shard ${{ matrix.shard }} only)
        run: |
          git clone --no-checkout --branch data --sparse \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git brreg-data
          cd brreg-data
          git sparse-checkout init --cone
          git sparse-checkout set data/${{ matrix.shard }}
          git checkout

      - name: Create shard branch
        run: |
          mkdir gh-pages-temp
          cd gh-pages-temp
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            go install github.com/gohugoio/hugo@latest && break || sleep 10
          done

      - name: Build gen-history tool
        run: |
          cd brreg-delta/ssr/gen-history
          go build -o ../../../gen-history

      - name: Generate shard ${{ matrix.shard }}
        run: |
          cd brreg-data
          echo "Processing shard ${{ matrix.shard }}"
          ../gen-history shard --shard ${{ matrix.shard }} --output ../output --templates ../brreg-delta/ssr

      - name: Commit and push shard to dedicated branch
        run: |
          cd gh-pages-temp

          # Copy generated HTML files for this shard
          if [ -d ../output/${{ matrix.shard }} ]; then
            cp -r ../output/${{ matrix.shard }} .

            git add ${{ matrix.shard }}

            if ! git diff --cached --quiet; then
              git commit -m "Add shard ${{ matrix.shard }}"
              # Push to dedicated branch for this shard
              git push -f origin HEAD:gh-pages-shard-${{ matrix.shard }}
              echo "Successfully pushed shard ${{ matrix.shard }} to gh-pages-shard-${{ matrix.shard }}"
            else
              echo "No changes for shard ${{ matrix.shard }}"
            fi
          else
            echo "No output generated for shard ${{ matrix.shard }}"
          fi

  finalize:
    needs: generate-shard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Merge all shard branches
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-combined
          cd gh-pages-combined
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create orphan branch for combined output
          git checkout --orphan gh-pages-combined
          git rm -rf . || true

          # Merge all shard branches sequentially
          for shard in {800..999}; do
            echo "Merging shard $shard..."
            if git fetch origin gh-pages-shard-$shard 2>/dev/null; then
              git checkout gh-pages-shard-$shard -- $shard 2>/dev/null || echo "Shard $shard has no content"
            else
              echo "Shard $shard branch does not exist, skipping"
            fi
          done

          # Stage all merged content
          git add .

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            go install github.com/gohugoio/hugo@latest && break || sleep 10
          done

      - name: Build navigation site
        run: |
          cd brreg-delta/ssr/navigation-site
          hugo --minify --destination ../../../gh-pages-combined/

      - name: Push combined branch to gh-pages
        run: |
          cd gh-pages-combined

          git add .
          git commit -m "Full rebuild of all entity histories $(date +%Y-%m-%d)" || echo "No changes"
          # Force push combined branch to gh-pages
          git push -f origin gh-pages-combined:gh-pages
          echo "Full rebuild completed and pushed to gh-pages"

      - name: Cleanup shard branches
        run: |
          cd gh-pages-combined
          for shard in {800..999}; do
            git push origin --delete gh-pages-shard-$shard 2>/dev/null || true
          done
          git push origin --delete gh-pages-combined 2>/dev/null || true
          echo "Cleanup completed"
