name: Generate Entity History Pages (Incremental)

on:
  workflow_run:
    workflows: ["Sync Brreg Data"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: brreg-data-workflows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-cache:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Generate cache key
        id: cache-key
        run: echo "key=data-git-${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT

      - name: Clone data branch (sparse, no checkout)
        run: |
          git clone --sparse --no-checkout --branch data \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git brreg-data

      - name: Cache git repository
        uses: actions/cache/save@v4
        with:
          path: brreg-data/.git
          key: ${{ steps.cache-key.outputs.key }}

  find-changed-shards:
    needs: prepare-cache
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.find-shards.outputs.shards }}
      has_changes: ${{ steps.find-shards.outputs.has_changes }}

    steps:
      - name: Restore cached git repository
        uses: actions/cache/restore@v4
        with:
          path: brreg-data/.git
          key: ${{ needs.prepare-cache.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Sparse checkout for state file
        run: |
          cd brreg-data
          git sparse-checkout init --cone
          git sparse-checkout set .last-history-commit
          git checkout data

      - name: Find changed shards
        id: find-shards
        run: |
          cd brreg-data

          # Get last commit
          if [ -f .last-history-commit ]; then
            LAST_COMMIT=$(cat .last-history-commit)
          else
            LAST_COMMIT="HEAD~1"
          fi

          echo "Last commit: $LAST_COMMIT"

          # Get changed files and extract unique shards
          CHANGED_FILES=$(git diff --name-only $LAST_COMMIT HEAD | grep '^data/' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "shards=[]" >> $GITHUB_OUTPUT
            echo "No changes found"
            exit 0
          fi

          # Extract unique 3-digit shards
          SHARDS=$(echo "$CHANGED_FILES" | grep '^data/[0-9][0-9][0-9]/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "shards=$SHARDS" >> $GITHUB_OUTPUT
          echo "Found shards: $SHARDS"

  generate-shard:
    needs: [prepare-cache, find-changed-shards]
    if: needs.find-changed-shards.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 200
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.find-changed-shards.outputs.shards) }}

    steps:
      - name: Checkout for composite action
        uses: actions/checkout@v4

      - name: Generate shard ${{ matrix.shard }}
        uses: ./.github/actions/generate-shard
        with:
          shard: ${{ matrix.shard }}
          cache-key: ${{ needs.prepare-cache.outputs.cache-key }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    needs: [prepare-cache, find-changed-shards, generate-shard]
    if: needs.find-changed-shards.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Restore cached git repository
        uses: actions/cache/restore@v4
        with:
          path: brreg-data/.git
          key: ${{ needs.prepare-cache.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Sparse checkout state file
        run: |
          cd brreg-data
          git sparse-checkout set .last-history-commit
          git checkout

      - name: Free disk space
        uses: jlumbroso/free-diskspace@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download and merge shard artifacts
        run: |
          # Get list of shards from the job output
          SHARDS='${{ needs.find-changed-shards.outputs.shards }}'
          echo "Processing shards: $SHARDS"

          # Function to download and merge a single shard
          process_shard() {
            local shard=$1
            local run_id=$2
            local repo=$3
            local temp_dir=$(mktemp -d)

            echo "Downloading shard $shard..."

            # Download this shard's artifact with retries
            download_success=false
            for i in 1 2 3; do
              if gh run download "$run_id" -n "shard-$shard" -D "$temp_dir" -R "$repo"; then
                download_success=true
                break
              else
                echo "Attempt $i failed for shard $shard"
                sleep 10
              fi
            done

            if [ "$download_success" = false ]; then
              echo "Warning: Failed to download shard $shard after 3 attempts, skipping"
              rm -rf "$temp_dir"
              return
            fi

            echo "Download complete for shard $shard"

            # Sync shard files to gh-pages (overwriting existing files)
            if [ -d "$temp_dir/$shard" ]; then
              rsync -a "$temp_dir/$shard/" "gh-pages/$shard/"
              echo "Merged shard $shard"
            else
              echo "Warning: Shard directory $shard not found in artifact"
            fi

            # Cleanup
            rm -rf "$temp_dir"
          }

          export -f process_shard
          export GH_TOKEN
          export RUN_ID="${{ github.run_id }}"
          export REPO="${{ github.repository }}"

          # Process shards in parallel with 4 workers
          echo $SHARDS | jq -r '.[]' | xargs -n 1 -P 4 -I {} bash -c 'process_shard {} "$RUN_ID" "$REPO"'

          echo "All shards merged"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save last processed commit to data branch
        run: |
          cd brreg-data
          git rev-parse HEAD > .last-history-commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Configure remote with token for authentication
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          git add .last-history-commit
          git commit -m "Update last history commit marker" || echo "No changes to commit marker"
          git push origin data

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update entity histories (incremental) $(date +%Y-%m-%d)"
            git push
            echo "Changes pushed successfully"
          fi
