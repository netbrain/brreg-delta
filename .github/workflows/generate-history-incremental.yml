name: Generate Entity History Pages (Incremental)

on:
  workflow_run:
    workflows: ["Sync Brreg Data"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: brreg-data-workflows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  find-changed-shards:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      shards: ${{ steps.find-shards.outputs.shards }}
      has_changes: ${{ steps.find-shards.outputs.has_changes }}

    steps:
      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: brreg-data
          fetch-depth: 0
          sparse-checkout: |
            .last-history-commit
            README.md
          sparse-checkout-cone-mode: false

      - name: Find changed shards
        id: find-shards
        run: |
          cd brreg-data

          # Get last commit
          if [ -f .last-history-commit ]; then
            LAST_COMMIT=$(cat .last-history-commit)
          else
            LAST_COMMIT="HEAD~1"
          fi

          echo "Last commit: $LAST_COMMIT"

          # Get changed files and extract unique shards
          CHANGED_FILES=$(git diff --name-only $LAST_COMMIT HEAD | grep '^data/' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "shards=[]" >> $GITHUB_OUTPUT
            echo "No changes found"
            exit 0
          fi

          # Extract unique 3-digit shards
          SHARDS=$(echo "$CHANGED_FILES" | grep '^data/[0-9][0-9][0-9]/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "shards=$SHARDS" >> $GITHUB_OUTPUT
          echo "Found shards: $SHARDS"

  generate-shard:
    needs: find-changed-shards
    if: needs.find-changed-shards.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 200
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.find-changed-shards.outputs.shards) }}

    steps:
      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Sparse checkout data branch (shard ${{ matrix.shard }} only)
        run: |
          git clone --no-checkout --branch data --sparse \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git brreg-data
          cd brreg-data
          git sparse-checkout init --cone
          git sparse-checkout set data/${{ matrix.shard }}
          git checkout

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            go install github.com/gohugoio/hugo@latest && break || sleep 10
          done

      - name: Build gen-history tool
        run: |
          cd brreg-delta/ssr/gen-history
          go build -o ../../../gen-history

      - name: Generate shard ${{ matrix.shard }}
        run: |
          cd brreg-data
          echo "Processing shard ${{ matrix.shard }}"
          ../gen-history shard --shard ${{ matrix.shard }} --output ../output --templates ../brreg-delta/ssr

      - name: Upload shard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: output/${{ matrix.shard }}
          retention-days: 1

  finalize:
    needs: [find-changed-shards, generate-shard]
    if: needs.find-changed-shards.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: brreg-data
          sparse-checkout: |
            .last-history-commit
            README.md
          sparse-checkout-cone-mode: false

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge shards into gh-pages
        run: |
          cd gh-pages

          # Copy all shard directories
          for shard_dir in ../artifacts/shard-*/; do
            if [ -d "$shard_dir" ]; then
              cp -r "$shard_dir"* . || true
            fi
          done

          echo "Merged all shard artifacts"

      - name: Build navigation site
        run: |
          cd brreg-delta/ssr
          go install github.com/gohugoio/hugo@latest
          cd navigation-site
          hugo --minify --destination ../../../gh-pages-nav

      - name: Copy navigation site to gh-pages
        run: |
          cp -r gh-pages-nav/* gh-pages/
          echo "Navigation site copied"

      - name: Save last processed commit to data branch
        run: |
          cd brreg-data
          git rev-parse HEAD > .last-history-commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-history-commit
          git commit -m "Update last history commit marker" || echo "No changes to commit marker"
          git push

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update entity histories (incremental) $(date +%Y-%m-%d)"
            git push
            echo "Changes pushed successfully"
          fi
