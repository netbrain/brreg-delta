name: Generate Entity History Pages (Incremental)

on:
  workflow_run:
    workflows: ["Sync Brreg Data"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: brreg-data-workflows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-cache:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Generate cache key
        id: cache-key
        run: echo "key=data-git-${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT

      - name: Clone data branch (sparse, no checkout)
        run: |
          git clone --sparse --no-checkout --branch data \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git brreg-data

      - name: Cache git repository
        uses: actions/cache/save@v4
        with:
          path: brreg-data/.git
          key: ${{ steps.cache-key.outputs.key }}

  find-changed-shards:
    needs: prepare-cache
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.find-shards.outputs.shards }}
      has_changes: ${{ steps.find-shards.outputs.has_changes }}

    steps:
      - name: Restore cached git repository
        uses: actions/cache/restore@v4
        with:
          path: brreg-data/.git
          key: ${{ needs.prepare-cache.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Sparse checkout for state file
        run: |
          cd brreg-data
          git sparse-checkout init --cone
          git sparse-checkout set .last-history-commit
          git checkout data

      - name: Find changed shards
        id: find-shards
        run: |
          cd brreg-data

          # Get last commit
          if [ -f .last-history-commit ]; then
            LAST_COMMIT=$(cat .last-history-commit)
          else
            LAST_COMMIT="HEAD~1"
          fi

          echo "Last commit: $LAST_COMMIT"

          # Get changed files and extract unique shards
          CHANGED_FILES=$(git diff --name-only $LAST_COMMIT HEAD | grep '^data/' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "shards=[]" >> $GITHUB_OUTPUT
            echo "No changes found"
            exit 0
          fi

          # Extract unique 3-digit shards
          SHARDS=$(echo "$CHANGED_FILES" | grep '^data/[0-9][0-9][0-9]/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "shards=$SHARDS" >> $GITHUB_OUTPUT
          echo "Found shards: $SHARDS"

  generate-shard:
    needs: [prepare-cache, find-changed-shards]
    if: needs.find-changed-shards.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 200
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.find-changed-shards.outputs.shards) }}

    steps:
      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Restore cached git repository
        uses: actions/cache/restore@v4
        with:
          path: brreg-data/.git
          key: ${{ needs.prepare-cache.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Sparse checkout shard ${{ matrix.shard }}
        run: |
          cd brreg-data
          git sparse-checkout set data/${{ matrix.shard }}
          git checkout

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            go install github.com/gohugoio/hugo@latest && break || sleep 10
          done

      - name: Build gen-history tool
        run: |
          cd brreg-delta/ssr/gen-history
          go build -o ../../../gen-history

      - name: Generate shard ${{ matrix.shard }}
        run: |
          cd brreg-data
          echo "Processing shard ${{ matrix.shard }}"
          ../gen-history shard --shard ${{ matrix.shard }} --output ../output --templates ../brreg-delta/ssr

      - name: Upload shard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: output/${{ matrix.shard }}
          retention-days: 1

  finalize:
    needs: [prepare-cache, find-changed-shards, generate-shard]
    if: needs.find-changed-shards.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Restore cached git repository
        uses: actions/cache/restore@v4
        with:
          path: brreg-data/.git
          key: ${{ needs.prepare-cache.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Sparse checkout state file
        run: |
          cd brreg-data
          git sparse-checkout set .last-history-commit
          git checkout

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download and merge shard artifacts
        run: |
          # Get list of shards from the job output
          SHARDS='${{ needs.find-changed-shards.outputs.shards }}'
          echo "Processing shards: $SHARDS"

          cd gh-pages

          # Download and process one shard at a time
          for shard in $(echo $SHARDS | jq -r '.[]'); do
            echo "Downloading shard $shard..."

            # Download this shard's artifact
            gh run download ${{ github.run_id }} -n "shard-$shard" -D ../temp-artifact || {
              echo "Warning: Failed to download shard $shard, skipping"
              continue
            }

            # Copy shard files to gh-pages
            if [ -d "../temp-artifact/$shard" ]; then
              cp -r "../temp-artifact/$shard" .
              echo "Merged shard $shard"
            fi

            # Cleanup to save disk space
            rm -rf ../temp-artifact

          done

          echo "All shards merged"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save last processed commit to data branch
        run: |
          cd brreg-data
          git rev-parse HEAD > .last-history-commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-history-commit
          git commit -m "Update last history commit marker" || echo "No changes to commit marker"
          git push

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update entity histories (incremental) $(date +%Y-%m-%d)"
            git push
            echo "Changes pushed successfully"
          fi
