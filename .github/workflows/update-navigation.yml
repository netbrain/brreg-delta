name: Update Navigation Site

on:
  push:
    branches:
      - master
    paths:
      - 'ssr/navigation-site/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            go install github.com/gohugoio/hugo@latest && break || sleep 10
          done

      - name: Build navigation site
        run: |
          cd ssr/navigation-site
          hugo --minify --destination ../../gh-pages/

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to index.html"
          else
            git commit -m "Update navigation site $(date +%Y-%m-%d)"
            git push
            echo "Navigation site updated successfully"
          fi
