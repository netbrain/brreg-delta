name: Sync Brreg Data

on:
  schedule:
    - cron: '30 */6 * * *'  # Run every 6 hours at :30 past the hour
  workflow_dispatch:
    inputs:
      rate-limit:
        description: 'API requests per second'
        required: false
        default: '10.0'
        type: string
      rate-burst:
        description: 'Maximum burst size for rate limiter'
        required: false
        default: '20'
        type: string
      workers:
        description: 'Number of concurrent workers'
        required: false
        default: '10'
        type: string
      max-failures:
        description: 'Maximum consecutive failures before exit'
        required: false
        default: '50'
        type: string
      max-duration:
        description: 'Maximum sync duration in minutes (0 = unlimited)'
        required: false
        default: '240'
        type: string

concurrency:
  group: brreg-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Brreg Data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master for code
        uses: actions/checkout@v4
        with:
          ref: master
          path: code

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          sparse-checkout: |
            data/.sync-state.json
            README.md

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download bulk files if initial sync
        run: |
          if [ ! -f data/data/.sync-state.json ]; then
            echo "Initial sync detected - downloading bulk files..."
            curl -L -o enheter.json.gz https://data.brreg.no/enhetsregisteret/api/enheter/lastned
            curl -L -o underenheter.json.gz https://data.brreg.no/enhetsregisteret/api/underenheter/lastned
            echo "Downloaded bulk files:"
            ls -lh *.json.gz
          else
            echo "State file exists - will perform incremental sync"
          fi

      - name: Run sync
        run: |
          cd code

          # Build flags based on workflow inputs (use defaults if not manually triggered)
          FLAGS="-data ../data/data"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use provided inputs
            FLAGS="$FLAGS -rate-limit ${{ inputs.rate-limit }}"
            FLAGS="$FLAGS -rate-burst ${{ inputs.rate-burst }}"
            FLAGS="$FLAGS -workers ${{ inputs.workers }}"
            FLAGS="$FLAGS -max-failures ${{ inputs.max-failures }}"
            FLAGS="$FLAGS -max-duration ${{ inputs.max-duration }}"

            echo "Running with custom configuration:"
            echo "  Rate limit: ${{ inputs.rate-limit }} req/s"
            echo "  Rate burst: ${{ inputs.rate-burst }}"
            echo "  Workers: ${{ inputs.workers }}"
            echo "  Max failures: ${{ inputs.max-failures }}"
            echo "  Max duration: ${{ inputs.max-duration }} minutes"
          else
            # Scheduled run - use defaults with 4-hour limit
            FLAGS="$FLAGS -max-duration 240"
            echo "Running with default configuration (4-hour limit)"
          fi

          go run . $FLAGS

      - name: Process deleted entities
        run: |
          cd data/data
          if [ -f .deleted-entities ]; then
            entity_count=$(wc -l < .deleted-entities)
            echo "Processing $entity_count deleted entities..."

            count=0
            while IFS= read -r orgnum; do
              # Convert orgnum to path (triple-digit sharding)
              path=$(echo "$orgnum" | sed 's/\(...\)\(...\)\(...\)/\1\/\2\/\3/')
              if [ -d "$path" ]; then
                count=$((count + 1))
                echo "[$count/$entity_count] Deleting: $path (orgnum: $orgnum)"
                # Use git rm with --sparse to remove files without expanding sparse checkout
                cd ..
                git rm -r --sparse "data/$path" 2>/dev/null || echo "  Warning: Failed to delete $path"
                cd data
              else
                echo "Skipping non-existent path: $path (orgnum: $orgnum)"
              fi
            done < .deleted-entities
            # Clear the deleted entities file after processing
            > .deleted-entities
            echo "Deleted entities processed: $count directories removed"
          else
            echo "No deleted entities to process"
          fi

      - name: Commit changes
        run: |
          cd data
          echo "Configuring git..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Adding files with --sparse flag..."
          # Use --sparse flag to add files outside sparse checkout without expanding it
          time git add --sparse .

          # Show what changed
          echo "Changed files:"
          git status --short | head -50
          total_changes=$(git status --short | wc -l)
          echo "Total files changed: $total_changes"

          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            echo "Creating commit..."
            git commit -m "Sync Brreg data $(date +%Y-%m-%d)"
            echo "Pushing to data branch..."
            git push origin data
            echo "Push complete"
          fi
