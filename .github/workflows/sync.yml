name: Sync Brreg Data

on:
  schedule:
    - cron: '30 5 * * *'  # Run daily at 5:30 AM UTC (after Brreg releases at 5:00 AM)
  workflow_dispatch:

jobs:
  sync:
    name: Sync Brreg Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master for code
        uses: actions/checkout@v4
        with:
          ref: master
          path: code

      - name: Checkout data branch (sparse - only state file)
        run: |
          git clone --depth 1 --filter=blob:none --branch data --single-branch --no-checkout https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git data-repo
          cd data-repo
          git sparse-checkout set --no-cone 'data/.sync-state.json' 'README.md'
          git checkout data
          mv data ../data
          cd ..
          rm -rf data-repo

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download bulk files if initial sync
        run: |
          if [ ! -f data/.sync-state.json ]; then
            echo "Initial sync detected - downloading bulk files..."
            curl -L -o enheter.json.gz https://data.brreg.no/enhetsregisteret/api/enheter/lastned
            curl -L -o underenheter.json.gz https://data.brreg.no/enhetsregisteret/api/underenheter/lastned
            echo "Downloaded bulk files:"
            ls -lh *.json.gz
          else
            echo "State file exists - will perform incremental sync"
          fi

      - name: Run sync
        run: |
          cd code
          go run . -data ../data

      - name: Process deleted entities
        run: |
          cd data
          if [ -f .deleted-entities ]; then
            echo "Processing deleted entities..."
            while IFS= read -r orgnum; do
              # Convert orgnum to path (triple-digit sharding)
              path=$(echo "$orgnum" | sed 's/\(...\)\(...\)\(...\)/\1\/\2\/\3/')
              if [ -d "$path" ]; then
                echo "Deleting: $path"
                git rm -r "$path" || true
              fi
            done < .deleted-entities
            # Clear the deleted entities file after processing
            > .deleted-entities
            echo "Deleted entities processed"
          else
            echo "No deleted entities to process"
          fi

      - name: Commit changes
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          # Show what changed
          echo "Changed files:"
          git status --short

          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "Sync Brreg data $(date +%Y-%m-%d)"
            git push origin data
          fi
