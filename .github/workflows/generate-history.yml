name: Generate Entity History Pages

on:
  workflow_run:
    workflows: ["Sync Brreg Data"]
    types:
      - completed
    branches:
      - data
  workflow_dispatch:

concurrency:
  group: brreg-data-workflows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    # Only run if sync workflow succeeded (or if manually triggered)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout brreg-delta (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: brreg-delta

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: brreg-data
          fetch-depth: 0  # Full history needed for git log

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Hugo
        run: |
          for i in 1 2 3; do
            go install github.com/gohugoio/hugo@latest && break || sleep 10
          done
          hugo version

      - name: Build gen-history tool
        run: |
          cd brreg-delta/ssr/gen-history
          go build -o ../../../gen-history
          cd ../../..
          ./gen-history  # Show usage

      - name: Generate entity pages and navigation site
        run: |
          cd brreg-data

          echo "Incremental generation (only changed entities)"
          ../gen-history generate --incremental --output ../gh-pages --workers 4 --templates ../brreg-delta/ssr

      - name: Save last processed commit to data branch
        run: |
          cd brreg-data
          git rev-parse HEAD > .last-history-commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-history-commit
          git commit -m "Update last history commit marker" || echo "No changes to commit marker"
          git push

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update entity histories $(date +%Y-%m-%d)"
            git push
            echo "Changes pushed successfully"
          fi
